[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-db-manager"
version = "0.1.0"
description = "A Python-based tool for managing local database environments"
requires-python = ">=3.10"
dependencies = [
    "rich"
]

[project.scripts]
ldm = "ldm.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
